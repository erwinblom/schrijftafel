name: Tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.61.1
      - run: node --test Onderdelen/tests/recovery.cjs Onderdelen/tests/start-document.cjs Onderdelen/tests/start-folder.cjs
      - run: node Onderdelen/tests/smoke.cjs
